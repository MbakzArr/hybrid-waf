# Hybrid WAF Configuration
# Mbadaliga, AB (219044112)

server:
  host: "0.0.0.0"
  port: 8080
  backend_url: "http://127.0.0.1:8081"  # DVWA default, override with --backend for Juice Shop

detection:
  mode: "hybrid"          # rule_only | ml_only | hybrid
  threshold: 0.5          # ML probability cutoff
  pipeline: "rf"          # only rf is deployed, run_waf.py refuses anything else

rules:
  file: "rules/rules.txt"

models:
  lr_model_path: "models/pipeline1_logreg.pkl"   # not used by the live proxy
  rf_model_path: "models/pipeline2_random_forest_aug.pkl"

logging:
  log_file: "logs/waf_events.csv"
  alert_file: "logs/waf_alerts.log"
  error_file: "logs/waf_errors.csv"    # malformed requests and backend failures

performance:
  latency_budget_ms: 10   # NFR01: a warning is printed when one request goes over
